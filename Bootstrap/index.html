<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-apps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body> <!--Refer bootstrap documentation for all bootstrap commands and stuffs-->
    <h1>This is a bootstrap course.</h1>
    <!--Typography
    Using class we can change the font size by including the bootstrap framework.
    To obtain this,
    We can simply type h1.h2.
    -->
    <h2 class="h6">Resource: Codeio</h2> 

    <!--Display class is used to make the font to look thinner but larger than the h tags-->
    <p class="display-6">This is done using p.display-6 tag</p>

    <!--Lead tag-->
    <p class="lead">This is a p tag with lead</p>
    <p>This is a simple p tag</p>

    <!--Underline-->
    <p class="text-decoration-underline">Underline</p>
    <p class="text-decoration-line-through">StrikeOut</p>
    <p class="text-center">center</p>
    <p><del>This</del><u> is a</u> <mark>sentence</mark></p>
    <p>This is a <em><mark>bootstrap</mark></em> trivia</p>
<hr><hr>


    <!--Theme and colours-->
    <span class="text-danger">This is a primary <p class="bg-primary">colour</p></span>
    <!--(or)-->
    <h1 class="text-danger bg-primary">This is a primary colour</h1>
</body>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
