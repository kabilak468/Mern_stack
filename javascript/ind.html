    <!--DOM--Document Object Model-->
    <script>
        console.log(document);
        let element=document.getElementById('head');
        console.log(element);
        console.log(element.textContent); <!--Adding text content-->
        element.textContent+=' You might get benefitted...or may not';

        let pudhusu=document.getElementById('box');<!--Adding tags-->
        pudhusu.innerHTML='<p>Do check out the upcoming updates !!!</p>';
        pudhusu.className='div_tag';<!--Adding class-->
        pudhusu.style.color='red';<!--Can change styles-->

        <!--Creating a tag-->
        let para=document.createElement('p');
        para.textContent='Pudhusana content';
        console.log(para);

        <!--append and prepend-->
        element.append("Appended content");
        element.prepend("Prepended content");
    </script>
    <!--
    Similarly, we are able to use getElementByTag(h1) for similar access and addition of properties...
    (or)
    querySelector('head')==> but it can access only the topmost first element..
    -->
